[project]
name = "cerastilo"
version = "0.1.0"
description = "Планировщик встреч «Жизнь и служение»"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "LicenseRef-Cerastilo"}
authors = [
    {name = "pioner14"}
]
keywords = ["schedule", "management", "pyside6", "desktop"]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | migrations
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_gitignore = true
skip = [".git", ".hg", ".mypy_cache", ".tox", ".venv", "_build", "buck-out", "build", "dist", "migrations"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
no_strict_optional = true
exclude = [
    "migrations/",
    "build/",
    "dist/",
]

[tool.pytest.ini_options]
qt_api = "pyside6"
minversion = "7.0"
addopts = "-ra -q --cov=. --cov-report=term-missing --import-mode=prepend"
testpaths = [
    "tests",
]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
pythonpath = ["."]

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "*/migrations/*",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
