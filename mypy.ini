[mypy]
ignore_missing_imports = True
no_strict_optional = True

# core/models and core/database use SQLAlchemy ORM patterns that mypy
# cannot fully type-check without stubs; suppress only those two modules.
[mypy-core.models]
ignore_errors = True

[mypy-core.database]
ignore_errors = True

# Repositories: suppress only missing-return and assignment errors
# that arise from SQLAlchemy query patterns, not all errors.
[mypy-core.repositories.base]
warn_return_any = False

[mypy-core.repositories.assignment_repository]
warn_return_any = False

[mypy-core.repositories.participant_repository]
warn_return_any = False

[mypy-core.repositories.week_repository]
warn_return_any = False

[mypy-core.repositories.schedule_repositories]
warn_return_any = False
