name: Build Binaries

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag for build'
        required: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' 
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller Pillow

    - name: Build with PyInstaller
      run: |
        pyinstaller nhjs.spec

    - name: Rename executable (Windows)
      if: runner.os == 'Windows'
      run: mv dist/NHJS_N.exe dist/NHJS_N_Windows.exe

    - name: Rename executable (Linux)
      if: runner.os == 'Linux'
      run: mv dist/NHJS_N dist/NHJS_N_Linux

    - name: Rename executable (macOS)
      if: runner.os == 'macOS'
      run: mv dist/NHJS_N dist/NHJS_N_macOS

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: NHJS_N_${{ matrix.os }}
        path: dist/NHJS_N*
