name: Сборка для Windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: Версия для имени архива
        required: true
        default: '0.2.0'
        type: string

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          architecture: x64

      - name: Установка зависимостей
        run: pip install -r requirements.txt pyinstaller

      - name: Сборка PyInstaller
        run: python -m PyInstaller --noconfirm packaging/pyinstaller/cerastilo.spec

      - name: Упаковка ZIP
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: Compress-Archive -Path dist/cerastilo -DestinationPath "Cerastilo-$env:RELEASE_VERSION-windows-x64.zip"

      - name: Загрузка артефакта
        uses: actions/upload-artifact@v4
        with:
          name: Cerastilo-${{ inputs.version }}-windows-x64
          path: Cerastilo-${{ inputs.version }}-windows-x64.zip
          if-no-files-found: error
